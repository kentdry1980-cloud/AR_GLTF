<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寸法確認機能付き ARビューア</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f5f5f5; overflow: hidden; }
        
        /* 3D/AR表示エリア */
        model-viewer { width: 100vw; height: 100vh; }

        /* --- UI関連の装飾 --- */
        #ui-container {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(255, 255, 255, 0.95); padding: 12px 20px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center; width: 80%; max-width: 400px;
        }
        #file-input { display: none; }
        .custom-button {
            display: inline-block; padding: 10px 20px; background-color: #28a745;
            color: white; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 8px;
        }
        #file-name { font-size: 12px; color: #666; word-break: break-all; }

        /* AR表示・サイズ確認パネル（AR中も画面に浮かびます） */
        #size-panel {
            position: absolute; top: 20px; left: 20px; z-index: 20;
            background: rgba(0, 0, 0, 0.7); color: white; padding: 15px;
            border-radius: 8px; font-size: 16px; line-height: 1.5;
            display: none; /* 最初は非表示 */
            pointer-events: none; /* タップ操作の邪魔にならないようにする */
        }

        #ar-button {
            position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
            padding: 16px 32px; background-color: #007bff; color: white;
            border: none; border-radius: 25px; font-size: 16px; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer; display: none;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <label for="file-input" class="custom-button">📂 GLBファイルを選択</label>
        <input type="file" id="file-input" accept=".glb">
        <div id="file-name">ファイルが選択されていません</div>
    </div>

    <div id="size-panel">
        <div>↔ 幅(X): <span id="size-w">0.0</span> cm</div>
        <div>↕ 高さ(Y): <span id="size-h">0.0</span> cm</div>
        <div>↙ 奥行(Z): <span id="size-d">0.0</span> cm</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 5px;">スケール: <span id="scale-val">1.00</span>倍</div>
    </div>

    <model-viewer 
        id="viewer"
        ar 
        ar-modes="webxr" 
        camera-controls 
        touch-action="none" 
        alt="選択された3Dモデル">
        
        <button slot="ar-button" id="ar-button">
            📦 ARで配置・サイズ確認
        </button>
    </model-viewer>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileNameDiv = document.getElementById('file-name');
        const viewer = document.getElementById('viewer');
        const arButton = document.getElementById('ar-button');
        const sizePanel = document.getElementById('size-panel');
        const uiContainer = document.getElementById('ui-container');

        let baseDimensions = { x: 0, y: 0, z: 0 }; // 元のサイズ（メートル）

        // ① ファイル選択時の処理
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                fileNameDiv.textContent = file.name;
                viewer.src = URL.createObjectURL(file);
                arButton.style.display = 'block';
            }
        });

        // ② モデルの読み込み完了時に「本来のサイズ」を取得
        viewer.addEventListener('load', () => {
            // getDimensions() はモデルのバウンディングボックス（囲み枠）のサイズをメートル単位で返します
            baseDimensions = viewer.getDimensions();
            sizePanel.style.display = 'block'; // サイズパネルを表示
            uiContainer.style.display = 'none'; // 邪魔なのでファイル選択パネルを隠す
        });

        // ③ 毎フレーム、現在のスケール（拡大縮小）に合わせて数値を計算・表示更新
        function updateSizeDisplay() {
            requestAnimationFrame(updateSizeDisplay); // 無限ループで監視

            if (baseDimensions.x === 0) return; // まだ読み込まれていない場合はスキップ

            // 現在のスケール倍率を取得（ブラウザの仕様によって文字列かオブジェクトになる対策）
            let currentScale = 1.0;
            if (typeof viewer.scale === 'string') {
                currentScale = parseFloat(viewer.scale.split(' ')[0]);
            } else if (viewer.scale && viewer.scale.x !== undefined) {
                currentScale = viewer.scale.x;
            }

            // (元のサイズ[m] × スケール倍率 × 100) でセンチメートルに変換
            const widthCm = (baseDimensions.x * currentScale * 100).toFixed(1);
            const heightCm = (baseDimensions.y * currentScale * 100).toFixed(1);
            const depthCm = (baseDimensions.z * currentScale * 100).toFixed(1);

            // 画面の数値を書き換え
            document.getElementById('size-w').textContent = widthCm;
            document.getElementById('size-h').textContent = heightCm;
            document.getElementById('size-d').textContent = depthCm;
            document.getElementById('scale-val').textContent = currentScale.toFixed(2);
        }

        // ループ処理開始
        updateSizeDisplay();
    </script>
</body>
</html>
