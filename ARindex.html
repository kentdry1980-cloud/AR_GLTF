<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精密寸法チェッカー (自由回転版)</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f5f5f5; overflow: hidden; }
        
        model-viewer { width: 100vw; height: 100vh; }

        /* --- 最初の画面のUI --- */
        #ui-container {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(255, 255, 255, 0.95); padding: 12px 20px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center; width: 80%; max-width: 400px;
        }
        #file-input { display: none; }
        .custom-button {
            display: inline-block; padding: 10px 20px; background-color: #28a745;
            color: white; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 8px;
        }
        #file-name { font-size: 12px; color: #666; word-break: break-all; }

        /* --- ARビューでも重ねて表示するパネル --- */
        #size-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.85); color: white; padding: 15px;
            border-radius: 12px; font-size: 14px; line-height: 1.5;
            z-index: 20;
            pointer-events: none; /* 背景はタップ透過 */
            display: none; 
            width: 220px;
            max-height: 80vh; /* 画面からはみ出さないように */
            overflow-y: auto; /* パネル内をスクロール可能に */
        }

        model-viewer.xr-ar #size-panel {
            display: block !important;
        }

        /* スライダー部分だけ操作可能にする */
        input[type="range"] {
            pointer-events: auto; 
            width: 100%;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        /* パネル内の見出し */
        .panel-heading {
            font-weight: bold; color: #4CAF50; margin-bottom: 5px; font-size: 16px;
        }
        hr { margin: 12px 0; border: 0; border-top: 1px solid #555; }

        /* AR起動ボタン */
        #ar-button {
            position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
            padding: 16px 32px; background-color: #007bff; color: white;
            border: none; border-radius: 25px; font-size: 16px; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer; display: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <label for="file-input" class="custom-button">📂 GLBファイルを選択</label>
        <input type="file" id="file-input" accept=".glb">
        <div id="file-name">ファイルが選択されていません</div>
    </div>

    <model-viewer 
        id="viewer"
        ar 
        ar-modes="webxr" 
        ar-scale="fixed"
        dom-overlay="size-panel" 
        camera-controls 
        touch-action="none" 
        alt="3Dモデル">
        
        <div id="size-panel">
            <div class="panel-heading">寸法情報</div>
            <div>↔ 幅(X): <span id="size-w">0.0</span> cm</div>
            <div>↕ 高さ(Y): <span id="size-h">0.0</span> cm</div>
            <div>↙ 奥行(Z): <span id="size-d">0.0</span> cm</div>
            
            <hr>
            
            <div class="panel-heading">サイズ調整</div>
            <div>倍率: <span id="scale-val">1.00</span>倍</div>
            <input type="range" id="scale-slider" min="0.1" max="3.0" step="0.05" value="1.0">

            <hr>

            <div class="panel-heading">角度調整</div>
            <div>縦回転(X軸): <span id="rot-x-val">0</span>°</div>
            <input type="range" id="rot-x" min="-180" max="180" step="1" value="0">

            <div>横回転(Y軸): <span id="rot-y-val">0</span>°</div>
            <input type="range" id="rot-y" min="-180" max="180" step="1" value="0">

            <div>傾き(Z軸): <span id="rot-z-val">0</span>°</div>
            <input type="range" id="rot-z" min="-180" max="180" step="1" value="0">
        </div>

        <button slot="ar-button" id="ar-button">
            📦 ARで配置・サイズ確認
        </button>
    </model-viewer>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileNameDiv = document.getElementById('file-name');
        const viewer = document.getElementById('viewer');
        const arButton = document.getElementById('ar-button');
        const sizePanel = document.getElementById('size-panel');
        const uiContainer = document.getElementById('ui-container');
        
        // 各種スライダーの取得
        const scaleSlider = document.getElementById('scale-slider');
        const rotXSlider = document.getElementById('rot-x');
        const rotYSlider = document.getElementById('rot-y');
        const rotZSlider = document.getElementById('rot-z');

        let baseDimensions = { x: 0, y: 0, z: 0 };

        // ① ファイル選択
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                fileNameDiv.textContent = file.name;
                viewer.src = URL.createObjectURL(file);
                arButton.style.display = 'block';
                
                // 新しいファイルを読み込んだらスライダーを初期値にリセット
                scaleSlider.value = 1.0;
                rotXSlider.value = 0;
                rotYSlider.value = 0;
                rotZSlider.value = 0;
                viewer.orientation = "0deg 0deg 0deg";
            }
        });

        // ② 読み込み完了時に本来のサイズを取得
        viewer.addEventListener('load', () => {
            baseDimensions = viewer.getDimensions();
            sizePanel.style.display = 'block';
            uiContainer.style.display = 'none';
            updateSizeDisplay(1.0);
        });

        // ③ スケール（サイズ）変更処理
        scaleSlider.addEventListener('input', (event) => {
            const currentScale = parseFloat(event.target.value);
            viewer.scale = `${currentScale} ${currentScale} ${currentScale}`;
            updateSizeDisplay(currentScale);
        });

        // ④ 角度（回転）変更処理
        function updateRotation() {
            const x = rotXSlider.value;
            const y = rotYSlider.value;
            const z = rotZSlider.value;
            
            // 3Dモデルの角度を直接指定 (X軸 Y軸 Z軸)
            viewer.orientation = `${x}deg ${y}deg ${z}deg`;
            
            // 数値表示の更新
            document.getElementById('rot-x-val').textContent = x;
            document.getElementById('rot-y-val').textContent = y;
            document.getElementById('rot-z-val').textContent = z;
        }

        // 各回転スライダーが動かされたら updateRotation を実行
        rotXSlider.addEventListener('input', updateRotation);
        rotYSlider.addEventListener('input', updateRotation);
        rotZSlider.addEventListener('input', updateRotation);

        // 寸法の計算と表示更新
        function updateSizeDisplay(scale) {
            if (baseDimensions.x === 0) return;

            const widthCm = (baseDimensions.x * scale * 100).toFixed(1);
            const heightCm = (baseDimensions.y * scale * 100).toFixed(1);
            const depthCm = (baseDimensions.z * scale * 100).toFixed(1);

            document.getElementById('size-w').textContent = widthCm;
            document.getElementById('size-h').textContent = heightCm;
            document.getElementById('size-d').textContent = depthCm;
            document.getElementById('scale-val').textContent = scale.toFixed(2);
        }
    </script>
</body>
</html>
