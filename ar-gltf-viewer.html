<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GLTF AR Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #header {
    width: 100%;
    padding: 18px 24px 14px;
    border-bottom: 1px solid #1e1e2e;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #5b7fff;
    box-shadow: 0 0 8px #5b7fff88;
  }

  #header h1 {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: #a0a0c0;
    text-transform: uppercase;
  }

  #main {
    width: 100%;
    max-width: 480px;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Drop zone */
  #dropzone {
    border: 1.5px dashed #2a2a3e;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #0d0d18;
    position: relative;
  }
  #dropzone:hover, #dropzone.drag-over {
    border-color: #5b7fff;
    background: #0f0f20;
  }
  #dropzone input {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  #dropzone .icon {
    font-size: 36px; margin-bottom: 12px;
    display: block;
  }
  #dropzone .label {
    font-size: 15px; color: #8080a0; line-height: 1.5;
  }
  #dropzone .label strong {
    color: #c0c0e0; display: block; margin-bottom: 4px;
  }
  #dropzone .formats {
    font-size: 11px; color: #404060;
    margin-top: 10px; letter-spacing: 0.05em;
  }

  /* Preview canvas */
  #preview-wrap {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  #preview-wrap.visible { display: flex; }

  #canvas-container {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 12px;
    overflow: hidden;
    background: #080810;
    border: 1px solid #1e1e2e;
  }
  #canvas-container canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .controls-hint {
    font-size: 11px; color: #404060;
    text-align: center; letter-spacing: 0.03em;
  }

  /* Buttons */
  .btn-row {
    display: flex; gap: 10px;
  }

  button {
    flex: 1;
    padding: 13px 16px;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  #btn-ar {
    background: #5b7fff;
    color: #fff;
  }
  #btn-ar:hover:not(:disabled) { opacity: 0.88; }

  #btn-reset {
    background: #1a1a2a;
    color: #8080a0;
    border: 1px solid #2a2a3e;
  }
  #btn-reset:hover { background: #1e1e30; }

  /* Status */
  #status {
    display: none;
    font-size: 13px;
    color: #6060a0;
    text-align: center;
    padding: 10px;
    background: #0d0d18;
    border-radius: 8px;
    border: 1px solid #1a1a2e;
  }
  #status.visible { display: block; }
  #status.error { color: #ff6b6b; border-color: #2a1010; background: #120808; }
  #status.success { color: #6bffb8; border-color: #0a2a1a; background: #080f0a; }

  /* AR not supported message */
  #ar-hint {
    display: none;
    font-size: 12px;
    color: #505070;
    text-align: center;
    line-height: 1.6;
    padding: 0 8px;
  }
  #ar-hint.visible { display: block; }

  /* Loading overlay */
  #loading {
    display: none;
    position: fixed; inset: 0;
    background: #0a0a0fcc;
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 100;
  }
  #loading.visible { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid #1e1e2e;
    border-top-color: #5b7fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; color: #6060a0; }

  /* Model info */
  #model-info {
    display: none;
    font-size: 12px;
    color: #505070;
    padding: 10px 14px;
    background: #0d0d18;
    border-radius: 8px;
    border: 1px solid #1a1a2e;
  }
  #model-info.visible { display: flex; align-items: center; gap: 8px; }
  #model-info .name {
    color: #8080b0;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
</style>
</head>
<body>

<div id="header">
  <div class="dot"></div>
  <h1>GLTF AR Viewer</h1>
</div>

<div id="main">

  <div id="dropzone">
    <input type="file" id="file-input" accept=".gltf,.glb">
    <span class="icon">📦</span>
    <div class="label">
      <strong>GLTFファイルを選択またはドロップ</strong>
      タップしてファイルを選ぶ
    </div>
    <div class="formats">.gltf / .glb 対応</div>
  </div>

  <div id="model-info">
    <span>📄</span>
    <span class="name" id="model-name"></span>
  </div>

  <div id="status"></div>

  <div id="preview-wrap">
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    <div class="controls-hint">ドラッグで回転 ・ ピンチでズーム ・ 2本指でパン</div>

    <div class="btn-row">
      <button id="btn-ar" disabled>📱 ARで表示</button>
      <button id="btn-reset">↩ リセット</button>
    </div>

    <div id="ar-hint">
      ARはAndroid Chrome（HTTPS必須）またはiOS Safari（USDZ変換が必要）で動作します。<br>
      現在の環境ではARが利用できない可能性があります。
    </div>
  </div>

</div>

<div id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">モデルを読み込み中...</p>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- GLTFLoader -->
<script>
// Inline minimal GLTFLoader for r128
// We'll load from CDN unpkg
</script>
<script type="module">
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js';
import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/DRACOLoader.js';

// ─── Three.js setup ───────────────────────────────────────────
const canvas = document.getElementById('canvas');
const container = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(0, 1, 3);

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(3, 6, 4);
scene.add(dir);
const fill = new THREE.DirectionalLight(0x8899ff, 0.3);
fill.position.set(-3, 2, -4);
scene.add(fill);

// Grid helper (subtle)
const grid = new THREE.GridHelper(4, 20, 0x1a1a2e, 0x1a1a2e);
scene.add(grid);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.1;
controls.maxDistance = 50;

// Resize
function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
new ResizeObserver(resize).observe(container);

// Animate
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

// ─── GLTF Loader setup ────────────────────────────────────────
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
loader.setDRACOLoader(dracoLoader);

let currentModel = null;

function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'visible ' + type;
  if (!msg) el.className = '';
}

function showLoading(msg = 'モデルを読み込み中...') {
  document.getElementById('loading-msg').textContent = msg;
  document.getElementById('loading').classList.add('visible');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('visible');
}

function loadGLTF(url, filename) {
  showLoading('モデルを読み込み中...');
  setStatus('');

  if (currentModel) {
    scene.remove(currentModel);
    currentModel = null;
  }

  loader.load(
    url,
    (gltf) => {
      hideLoading();
      currentModel = gltf.scene;
      scene.add(currentModel);

      // Center & scale to fit
      const box = new THREE.Box3().setFromObject(currentModel);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.5 / maxDim;
      currentModel.scale.setScalar(scale);
      currentModel.position.sub(center.multiplyScalar(scale));
      currentModel.position.y += size.y * scale * 0.5;

      // Camera reset
      camera.position.set(0, 1.5, 3);
      controls.target.set(0, size.y * scale * 0.5, 0);
      controls.update();

      // Show UI
      document.getElementById('preview-wrap').classList.add('visible');
      document.getElementById('model-info').classList.add('visible');
      document.getElementById('model-name').textContent = filename;
      document.getElementById('dropzone').style.display = 'none';

      setStatus('✓ モデルを読み込みました', 'success');
      setTimeout(() => setStatus(''), 3000);

      checkAR();

      console.log('Loaded:', filename, '| Animations:', gltf.animations.length);
    },
    (progress) => {
      if (progress.total > 0) {
        const pct = Math.round(progress.loaded / progress.total * 100);
        document.getElementById('loading-msg').textContent = `読み込み中... ${pct}%`;
      }
    },
    (err) => {
      hideLoading();
      console.error(err);
      setStatus('⚠ 読み込みエラー：' + (err.message || 'ファイルを確認してください'), 'error');
    }
  );
}

// ─── File input ───────────────────────────────────────────────
const fileInput = document.getElementById('file-input');
const dropzone = document.getElementById('dropzone');

function handleFile(file) {
  if (!file) return;
  if (!file.name.match(/\.(gltf|glb)$/i)) {
    setStatus('⚠ .gltf または .glb ファイルを選択してください', 'error');
    document.getElementById('status').classList.add('visible');
    return;
  }
  const url = URL.createObjectURL(file);
  loadGLTF(url, file.name);
}

fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});

// ─── Reset ────────────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  document.getElementById('preview-wrap').classList.remove('visible');
  document.getElementById('model-info').classList.remove('visible');
  document.getElementById('dropzone').style.display = '';
  document.getElementById('btn-ar').disabled = true;
  document.getElementById('ar-hint').classList.remove('visible');
  setStatus('');
  fileInput.value = '';
});

// ─── WebXR AR ─────────────────────────────────────────────────
function checkAR() {
  const btn = document.getElementById('btn-ar');
  const hint = document.getElementById('ar-hint');

  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
      if (supported) {
        btn.disabled = false;
        btn.textContent = '📱 ARで表示';
        hint.classList.remove('visible');
      } else {
        btn.disabled = true;
        hint.classList.add('visible');
      }
    });
  } else {
    btn.disabled = true;
    hint.classList.add('visible');
  }
}

document.getElementById('btn-ar').addEventListener('click', async () => {
  if (!navigator.xr) return;

  try {
    showLoading('ARセッションを開始中...');

    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body }
    });

    renderer.xr.setSession(session);

    // Hit-test setup
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.05, 0.065, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x5b7fff, opacity: 0.8, transparent: true, side: THREE.DoubleSide })
    );
    reticle.visible = false;
    scene.add(reticle);

    let placed = false;

    // Tap to place
    session.addEventListener('select', () => {
      if (reticle.visible && currentModel) {
        currentModel.position.setFromMatrixPosition(reticle.matrix);
        placed = true;
      }
    });

    session.addEventListener('end', () => {
      hitTestSource?.cancel();
      hitTestSource = null;
      hitTestSourceRequested = false;
      scene.remove(reticle);
      hideLoading();

      // Reset model position for 3D preview
      if (currentModel) {
        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        currentModel.position.sub(center);
        currentModel.position.y = 0;
      }
    });

    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const xrSession = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          xrSession.requestReferenceSpace('viewer').then((vs) => {
            xrSession.requestHitTestSource({ space: vs }).then((source) => {
              hitTestSource = source;
              hideLoading();
            });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const results = frame.getHitTestResults(hitTestSource);
          if (results.length > 0 && !placed) {
            const hit = results[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            if (!placed) reticle.visible = false;
          }
        }
      }
      controls.update();
      renderer.render(scene, camera);
    });

  } catch (e) {
    hideLoading();
    console.error(e);
    setStatus('⚠ AR起動エラー：' + e.message, 'error');
  }
});
</script>
</body>
</html>
