<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GLTF AR Viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 16px 20px;
    border-bottom: 1px solid #1e1e2e;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #5b7fff;
    box-shadow: 0 0 8px #5b7fff88;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.09em;
    color: #8080a0;
    text-transform: uppercase;
  }

  #main {
    width: 100%;
    max-width: 480px;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Drop zone */
  #dropzone {
    border: 1.5px dashed #2a2a40;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    background: #0d0d18;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  #dropzone.drag-over {
    border-color: #5b7fff;
    background: #0f0f22;
  }
  #dropzone input {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  #dropzone .icon { font-size: 34px; display: block; margin-bottom: 10px; }
  #dropzone .label { font-size: 14px; color: #7070a0; line-height: 1.6; }
  #dropzone .label strong { color: #b0b0d0; display: block; }
  #dropzone .fmt { font-size: 11px; color: #333350; margin-top: 8px; letter-spacing: 0.04em; }

  /* model-viewer */
  model-viewer {
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 12px;
    border: 1px solid #1e1e2e;
    background: #080812;
    --poster-color: transparent;
    display: none;
  }
  model-viewer.visible { display: block; }

  /* AR button inside model-viewer */
  model-viewer::part(default-ar-button) {
    bottom: 12px;
    right: 12px;
  }

  /* Slot: AR button custom */
  #ar-btn {
    position: absolute;
    bottom: 12px; right: 12px;
    background: #5b7fff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 12px #5b7fff44;
  }

  .hint {
    font-size: 11px;
    color: #44445a;
    text-align: center;
    line-height: 1.6;
    padding: 0 4px;
  }

  #info {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #0d0d18;
    border-radius: 8px;
    border: 1px solid #1a1a2e;
    font-size: 12px;
    color: #6060a0;
  }
  #info.visible { display: flex; }
  #info .name {
    color: #9090c0;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  #status {
    font-size: 13px;
    color: #6060a0;
    text-align: center;
    padding: 10px 14px;
    background: #0d0d18;
    border-radius: 8px;
    border: 1px solid #1a1a2e;
    display: none;
  }
  #status.visible { display: block; }
  #status.err { color: #ff6b6b; border-color: #2a1010; background: #100808; }
  #status.ok  { color: #6bffb8; border-color: #0a2a1a; background: #080f0a; }

  .btn-row { display: flex; gap: 10px; }
  .btn-row button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #btn-ar {
    background: #5b7fff;
    color: #fff;
    display: none;
  }
  #btn-ar.visible { display: block; }
  #btn-ar:disabled { opacity: 0.3; cursor: not-allowed; }
  #btn-reset {
    background: #141420;
    color: #7070a0;
    border: 1px solid #2a2a3e;
    display: none;
  }
  #btn-reset.visible { display: block; }

  #ar-not-supported {
    display: none;
    font-size: 12px;
    color: #404055;
    text-align: center;
    line-height: 1.7;
  }
  #ar-not-supported.visible { display: block; }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>GLTF AR Viewer</h1>
</header>

<div id="main">

  <div id="dropzone">
    <input type="file" id="file-input" accept=".gltf,.glb">
    <span class="icon">📦</span>
    <div class="label">
      <strong>GLB / GLTF ファイルを選択</strong>
      タップしてファイルを開く
    </div>
    <div class="fmt">.glb &nbsp;/&nbsp; .gltf</div>
  </div>

  <div id="info"><span>📄</span><span class="name" id="fname"></span></div>

  <model-viewer
    id="mv"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    shadow-intensity="1"
    auto-rotate
    environment-image="neutral"
  >
    <button slot="ar-button" id="ar-btn">📱 ARで表示</button>
  </model-viewer>

  <div id="status"></div>

  <div class="btn-row">
    <button id="btn-reset">↩ 別のファイルを開く</button>
  </div>

  <div id="ar-not-supported">
    AR表示はAndroid Chrome（HTTPS環境）またはiOS Safari（.usdzが必要）で動作します。<br>
    このブラウザではARが利用できません。
  </div>

  <div class="hint">ドラッグで回転・ピンチでズーム・2本指でパン</div>

</div>

<script>
const fileInput = document.getElementById('file-input');
const dropzone  = document.getElementById('dropzone');
const mv        = document.getElementById('mv');
const status    = document.getElementById('status');
const info      = document.getElementById('info');
const fname     = document.getElementById('fname');
const btnReset  = document.getElementById('btn-reset');
const arNotSup  = document.getElementById('ar-not-supported');

function showStatus(msg, type) {
  status.textContent = msg;
  status.className = 'visible ' + (type || '');
}
function clearStatus() { status.className = ''; }

function loadFile(file) {
  if (!file) return;
  if (!/\.(glb|gltf)$/i.test(file.name)) {
    showStatus('⚠ .glb または .gltf ファイルを選んでください', 'err');
    return;
  }

  const url = URL.createObjectURL(file);

  showStatus('読み込み中...');
  mv.src = url;
  fname.textContent = file.name;
}

mv.addEventListener('load', () => {
  clearStatus();
  dropzone.style.display = 'none';
  mv.classList.add('visible');
  info.classList.add('visible');
  btnReset.classList.add('visible');

  // AR support check
  if (!mv.canActivateAR) {
    arNotSup.classList.add('visible');
  }
});

mv.addEventListener('error', (e) => {
  showStatus('⚠ 読み込みエラー。ファイルを確認してください。', 'err');
  console.error(e);
});

fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});

btnReset.addEventListener('click', () => {
  mv.src = '';
  mv.classList.remove('visible');
  info.classList.remove('visible');
  btnReset.classList.remove('visible');
  arNotSup.classList.remove('visible');
  dropzone.style.display = '';
  clearStatus();
  fileInput.value = '';
});
</script>
</body>
</html>
